<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | AI Interview Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1a1f4b,#0a0c1b);
  color:#fff;
}

/* AUTH CARD */
.auth-card{
  width:380px;
  padding:35px;
  background:rgba(255,255,255,0.08);
  border-radius:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 30px 60px rgba(0,0,0,0.4);
  animation:slideUp .7s ease;
  text-align:center;
}

@keyframes slideUp{
  from{transform:translateY(40px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* AI ICON */
.ai-badge{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c63ff,#00e5ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#000;
}

.auth-card h2{
  margin-bottom:10px;
  font-size:28px;
}

.auth-card p.subtitle{
  font-size:14px;
  opacity:0.8;
  margin-bottom:25px;
}

/* INPUTS */
.auth-card input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:none;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

/* BUTTON */
.auth-card button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#6c63ff,#00e5ff);
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.auth-card button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(108,99,255,0.5);
}

/* LINKS */
.auth-card .link{
  margin-top:18px;
  font-size:14px;
}

.auth-card .link a{
  color:#6c63ff;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="auth-card">

  <div class="ai-badge">🧠</div>

  <h2>Create Account</h2>
  <p class="subtitle">Start your AI-powered interview journey</p>

  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">

  <button onclick="register()">Register</button>

  <div class="link">
    Already have an account? <a href="login.html">Login</a>
  </div>

</div>

<script src="js/auth.js"></script>
</body>
</html>

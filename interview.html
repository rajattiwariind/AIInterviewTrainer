<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Interview | Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background:#0a0c1b;
  color:white;
  font-family:Poppins;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:10px;
}

/* AI AVATAR */
.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c63ff,#00e5ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  position:relative;
}

.mouth{
  width:18px;
  height:6px;
  background:black;
  border-radius:10px;
  position:absolute;
  bottom:14px;
}

.talking .mouth{
  animation:talk 0.2s infinite;
}

@keyframes talk{
  0%{height:6px}
  50%{height:14px}
  100%{height:6px}
}

/* AI THINKING DOTS */
.thinking{
  font-size:14px;
  opacity:0.7;
  margin-bottom:8px;
}

.dots::after{
  content:'';
  animation:dots 1.5s infinite;
}

@keyframes dots{
  0%{content:''}
  33%{content:'.'}
  66%{content:'..'}
  100%{content:'...'}
}

/* CHAT */
.chat-box{
  width:100%;
  max-width:720px;
  height:360px;
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:20px;
  overflow-y:auto;
  margin-bottom:8px;
}

.ai,.user{
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
  max-width:70%;
  animation:fadeIn .3s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.ai{background:rgba(108,99,255,0.3)}
.user{background:rgba(0,229,255,0.3);margin-left:auto}

/* CONFIDENCE */
.confidence-wrap{
  width:100%;
  max-width:720px;
  margin:10px 0;
}

.confidence-bg{
  background:#222;
  height:10px;
  border-radius:10px;
}

#confidenceBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff5252,#ffeb3b,#00e676);
  border-radius:10px;
  transition:width .5s ease;
}

/* CONTROLS */
.controls{
  width:100%;
  max-width:720px;
  margin-top:15px;
  display:flex;
  gap:10px;
}

textarea{
  flex:1;
  height:70px;
  border-radius:15px;
  padding:10px;
  background:#11142b;
  color:white;
  border:none;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#6c63ff,#00e5ff);
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

button.listening{
  background:#ff5252;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 rgba(255,82,82,0.6)}
  70%{box-shadow:0 0 20px rgba(255,82,82,0)}
  100%{box-shadow:0 0 0 rgba(255,82,82,0)}
}

/* WEBCAM */
video{
  margin-top:15px;
  width:220px;
  border-radius:12px;
  border:2px solid #6c63ff;
}

/* FINAL GRAPH */
#finalSection{
  display:none;
  max-width:720px;
  width:100%;
  background:#11142b;
  padding:25px;
  border-radius:20px;
  margin-top:20px;
  animation:fadeIn .5s ease;
}

#finalSection h3{
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
  <div class="avatar" id="avatar">
    🤖
    <div class="mouth"></div>
  </div>
  <h1>AI Interviewer</h1>
</div>

<div class="thinking" id="thinking" style="display:none">
  AI is thinking<span class="dots"></span>
</div>

<div class="chat-box" id="chat"></div>

<div class="confidence-wrap">
  <small>Confidence Level</small>
  <div class="confidence-bg">
    <div id="confidenceBar"></div>
  </div>
</div>

<video id="camera" autoplay muted></video>

<div class="controls">
  <textarea id="answer" placeholder="Speak or type your answer..."></textarea>
  <button id="micBtn">🎤</button>
  <button onclick="submitAnswer()">Send</button>
</div>

<!-- FINAL AI SECTION -->
<div id="finalSection">
  <h3>AI Performance Analysis 📊</h3>
  <canvas id="confidenceChart"></canvas>
  <p id="aiFeedback"></p>
</div>

<script src="js/interview.js"></script>
</body>
</html>
